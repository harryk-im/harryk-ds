name: Publish Packages

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - ".changeset/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/publish.yml"

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Changesets 기반 버전 관리 및 배포
  release:
    name: Version and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Configure npm for scoped packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # .npmrc 파일 생성
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          echo "@harryk-ds:registry=https://registry.npmjs.org/" >> ~/.npmrc
          echo "//registry.npmjs.org/:always-auth=true" >> ~/.npmrc

          # npm 인증 확인
          npm whoami || echo "⚠️ npm whoami 실패 (토큰 확인 필요)"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Detect changed packages and create changesets
        id: detect
        run: |
          # # 변경된 패키지 감지
          # # HEAD^가 없을 경우 (첫 번째 커밋) 처리
          # if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
          #   PREV_SHA=$(git rev-parse HEAD^)
          # else
          #   # 첫 번째 커밋인 경우, 빈 트리와 비교
          #   PREV_SHA=$(git hash-object -t tree /dev/null)
          # fi

          # CURRENT_SHA=$(git rev-parse HEAD)

          # CHANGED_FILES=$(git diff --name-only $PREV_SHA $CURRENT_SHA 2>/dev/null || echo "")

          # if [ -z "$CHANGED_FILES" ]; then
          #   echo "⚠️ 변경된 파일이 없습니다."
          #   echo "has-changes=false" >> $GITHUB_OUTPUT
          #   exit 0
          # fi

          # CHANGED_PACKAGES=""

          # # packages/ui 변경 확인
          # if echo "$CHANGED_FILES" | grep -q "^packages/ui/"; then
          #   UI_CHANGED=$(echo "$CHANGED_FILES" | grep "^packages/ui/" | grep -v "/dist/" | grep -v "/node_modules/" | grep -v "\.log$" || true)
          #   if [ -n "$UI_CHANGED" ]; then
          #     CHANGED_PACKAGES="$CHANGED_PACKAGES @harryk-ds/ui"
          #   fi
          # fi

          # # packages/motion 변경 확인
          # if echo "$CHANGED_FILES" | grep -q "^packages/motion/"; then
          #   MOTION_CHANGED=$(echo "$CHANGED_FILES" | grep "^packages/motion/" | grep -v "/dist/" | grep -v "/node_modules/" | grep -v "\.log$" || true)
          #   if [ -n "$MOTION_CHANGED" ]; then
          #     CHANGED_PACKAGES="$CHANGED_PACKAGES @harryk-ds/motion"
          #   fi
          # fi

          # 테스트 모드: 변경이 없어도 모든 패키지 배포 (필요 시 활성화)
          # if [ -z "$CHANGED_PACKAGES" ]; then
          #   CHANGED_PACKAGES="@harryk-ds/ui @harryk-ds/motion"
          # fi

          # 공백 제거 (xargs는 빈 문자열일 때 문제 발생 가능)
          CHANGED_PACKAGES=$(echo "$CHANGED_PACKAGES" | tr -s ' ' | xargs)

          if [ -z "$CHANGED_PACKAGES" ]; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "⚠️ 변경된 패키지가 없습니다."
            exit 0
          fi

          echo "packages=$CHANGED_PACKAGES" >> $GITHUB_OUTPUT
          echo "has-changes=true" >> $GITHUB_OUTPUT
          echo "변경된 패키지: $CHANGED_PACKAGES"

          # 변경된 패키지에 대해 자동으로 changeset 생성 (patch 버전)
          for pkg in $CHANGED_PACKAGES; do
            echo "changeset 생성: $pkg (patch)"

            # changeset 파일명: 타임스탬프 + 랜덤값
            CHANGESET_ID=$(date +%s)-$$-$(shuf -i 1000-9999 -n 1 2>/dev/null || echo $RANDOM)
            CHANGESET_FILE=".changeset/auto-${CHANGESET_ID}.md"

            # changeset 파일 생성
            # Changesets는 패키지 전체 이름 사용 (스코프 포함)
            {
              echo "---"
              echo "\"$pkg\": patch"
              echo "---"
              echo ""
              echo "자동 생성된 changeset: 패키지 변경사항에 따른 패치 버전 업데이트"
            } > "$CHANGESET_FILE"

            echo "✅ changeset 파일 생성: $CHANGESET_FILE"
            cat "$CHANGESET_FILE"
          done

      - name: Version packages with Changesets
        if: steps.detect.outputs.has-changes == 'true'
        run: |
          # Changesets로 버전 업데이트
          pnpm changeset version

          # 변경된 버전 확인
          git diff --name-only

      - name: Publish to npm
        if: steps.detect.outputs.has-changes == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Git 설정
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Changesets를 사용하여 배포 (workspace 의존성 자동 처리)
          pnpm changeset publish

          # 버전 업데이트 및 배포 결과 커밋
          git add .
          git commit -m "chore: version packages" || echo "⚠️ 커밋할 변경사항 없음"
          git push || echo "⚠️ 푸시 실패 (이미 푸시됨)"

          # 태그 푸시
          git push --tags || echo "⚠️ 태그 푸시 실패"

      - name: Summary
        if: steps.detect.outputs.has-changes == 'true'
        run: |
          CHANGED_PACKAGES="${{ steps.detect.outputs.packages }}"
          echo "## 🚀 배포 완료" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "다음 패키지가 Changesets를 통해 배포되었습니다:" >> $GITHUB_STEP_SUMMARY
          for pkg in $CHANGED_PACKAGES; do
            echo "- \`$pkg\`" >> $GITHUB_STEP_SUMMARY
          done


name: Release Packages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish Changed Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changeset은 커밋 로그를 분석하므로 전체 기록 필요

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install Dependencies
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile

      # (선택사항) 빌드 단계 - 각 패키지를 빌드하는 과정이 필요하다면 추가
      - name: Build Packages
        run: pnpm build

      # changeset 버전 업데이트 (변경된 패키지만 감지 후 version bump)
      - name: Version Packages
        id: changesets
        run: npx changeset version

      # 변경사항이 있다면 git commit & push
      - name: Commit and Push version changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "ci: version bump [skip ci]" || echo "No changes to commit"
          git push origin main || true

      # 실제 npm 배포 단계
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx changeset publish

name: "Chromatic Deployment"

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/ui/**"
      - "packages/motion/**"
      - "apps/storybook/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/chromatic.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/ui/**"
      - "packages/motion/**"
      - "apps/storybook/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/chromatic.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Chromatic이 변경사항을 추적하기 위해 전체 히스토리 필요

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run Chromatic
        id: chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/storybook
          buildScriptName: build-storybook
          skip: 'chromatic' # 시각적 회귀 테스트 건너뛰기
          onlyChanged: true # TurboSnap 활성화 (변경된 스토리만 테스트)
          exitZeroOnChanges: true # PR에서 변경사항이 있어도 실패하지 않음

      - name: Find previous comment
        if: github.event_name == 'pull_request' && steps.chromatic.outputs.storybookUrl
        uses: peter-evans/find-comment@v2
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '🚀 Storybook:'

      - name: Create or update PR comment
        if: github.event_name == 'pull_request' && steps.chromatic.outputs.storybookUrl
        uses: peter-evans/create-or-update-comment@v2
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🚀 Storybook: ${{ steps.chromatic.outputs.storybookUrl }}
            🚀 Chromatic: ${{ steps.chromatic.outputs.url }}
          edit-mode: replace
